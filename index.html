<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAGOR AI — Premium</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: sans-serif; color: #e2e8f0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
    background: #070b16;
    background-image: radial-gradient(600px 300px at 15% 0%, rgba(56,189,248,0.25), transparent 60%),
      radial-gradient(600px 300px at 90% 100%, rgba(168,85,247,0.25), transparent 60%);
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 16px 22px;
    background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 10;
  }
  .logo {
    width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #38bdf8, #a855f7); color: #fff; font-size: 22px;
    box-shadow: 0 0 24px rgba(56,189,248,0.5);
  }
  .logo svg { width: 26px; height: 26px; }
  .title { font-size: 22px; font-weight: bold; letter-spacing: 1px; }
  .title span { background: linear-gradient(90deg, #38bdf8, #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .subtitle { font-size: 12px; color: #94a3b8; }
  #newchat {
    margin-left: auto; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: #e2e8f0; padding: 9px 14px; border-radius: 20px; cursor: pointer; font-size: 14px; display: flex; gap: 6px; align-items: center;
  }
  #newchat svg { width: 16px; height: 16px; }
  #newchat:hover { background: rgba(255,255,255,0.12); }
  #eyetoggle {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: #e2e8f0; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  #eyetoggle:hover { background: rgba(255,255,255,0.12); }
  #eyetoggle svg { width: 18px; height: 18px; }
  #sidebartoggle {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: #e2e8f0; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  #sidebartoggle:hover { background: rgba(255,255,255,0.12); }
  #sidebartoggle svg { width: 18px; height: 18px; }
  #sidebar {
    position: fixed; top: 0; left: 0; height: 100vh; height: 100dvh; width: 280px; max-width: 85vw; z-index: 50;
    background: #0d1526; border-right: 1px solid rgba(255,255,255,0.1);
    transform: translateX(-100%); transition: transform 0.25s ease; display: flex; flex-direction: column; padding: 18px;
  }
  #sidebar.open { transform: translateX(0); }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 40; display: none; }
  #overlay.show { display: block; }
  .side-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .side-head .title { font-size: 19px; }
  #sideclose { margin-left: auto; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #e2e8f0; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #sideclose svg { width: 16px; height: 16px; }
  .side-item {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.35); color: #e2e8f0;
    padding: 12px 16px; border-radius: 14px; cursor: pointer; font-size: 15px;
  }
  .side-item:hover { background: rgba(56,189,248,0.2); }
  .side-item svg { width: 18px; height: 18px; }
  .side-foot { margin-top: auto; font-size: 12px; color: #64748b; text-align: center; }
  #chat { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; max-width: 820px; width: 100%; margin: 0 auto; }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row.user { flex-direction: row-reverse; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .avatar svg { width: 19px; height: 19px; }
  .avatar.ai { background: linear-gradient(135deg, #38bdf8, #a855f7); }
  .avatar.user { background: #334155; }
  .msg {
    max-width: 80%; padding: 13px 17px; border-radius: 18px; line-height: 1.65; white-space: pre-wrap; word-wrap: break-word;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }
  .row.user .msg { background: linear-gradient(135deg, #0284c7, #7c3aed); border: none; }
  .tools { display: flex; gap: 8px; margin-top: 6px; }
  .tools button {
    background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 13px; display: flex; gap: 4px; align-items: center;
  }
  .tools button:hover { color: #e2e8f0; }
  .tools svg { width: 14px; height: 14px; }
  .dots span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #94a3b8; margin-right: 4px; animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
  #chips { display: flex; gap: 9px; flex-wrap: wrap; padding: 0 16px 14px; max-width: 820px; width: 100%; margin: 0 auto; }
  .chip {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #e2e8f0;
    padding: 9px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; display: flex; gap: 6px; align-items: center;
  }
  .chip:hover { background: rgba(56,189,248,0.15); border-color: rgba(56,189,248,0.4); }
  .chip .material-icons { font-size: 17px; color: #38bdf8; }
  #form { padding: 16px; background: rgba(255,255,255,0.04); border-top: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px); }
  #form-inner { display: flex; gap: 10px; max-width: 820px; width: 100%; margin: 0 auto; }
  #input {
    flex: 1; padding: 14px 20px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(0,0,0,0.35); color: #e2e8f0; font-size: 16px; outline: none;
  }
  #input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.2); }
  #send {
    width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer; color: #fff; font-size: 18px;
    background: linear-gradient(135deg, #38bdf8, #a855f7); box-shadow: 0 0 20px rgba(168,85,247,0.5);
  }
  #send:disabled { opacity: 0.5; }
  #send svg { width: 20px; height: 20px; }
  footer { text-align: center; font-size: 12px; color: #64748b; padding: 8px 0 14px; }
  @media (max-width: 600px) {
    header { padding: 12px 14px; gap: 10px; }
    .logo { width: 38px; height: 38px; border-radius: 12px; }
    .logo svg { width: 22px; height: 22px; }
    .title { font-size: 18px; }
    .subtitle { display: none; }
    #newchat { padding: 8px 11px; font-size: 13px; }
    #newchat svg { width: 14px; height: 14px; }
    #eyetoggle { width: 34px; height: 34px; }
    #eyetoggle svg { width: 16px; height: 16px; }
    #sidebartoggle { width: 34px; height: 34px; }
    #sidebartoggle svg { width: 16px; height: 16px; }
    #chat { padding: 14px 10px; gap: 12px; }
    .msg { max-width: 88%; padding: 11px 14px; font-size: 15px; }
    .avatar { width: 32px; height: 32px; }
    .avatar svg { width: 17px; height: 17px; }
    #chips { padding: 0 10px 12px; gap: 7px; }
    .chip { padding: 8px 12px; font-size: 13px; }
    #form { padding: 12px 10px; }
    #input { font-size: 16px; padding: 12px 16px; }
    #send { width: 48px; height: 48px; font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <button id="sidebartoggle" title="Sidebar"><i data-lucide="panel-left"></i></button>
  <div class="logo"><i data-lucide="bot"></i></div>
  <div>
    <div class="title"><span>SAGOR</span> AI <i data-lucide="badge-check" class="badge-check"></i></div>
    <div class="subtitle">Premium AI Chat</div>
  </div>
  <button id="newchat"><i data-lucide="trash-2"></i> New Chat</button>
  <button id="eyetoggle" title="Suggestions লুকাও"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 2c1.981 0 3.671.992 4.933 2.078 1.27 1.091 2.187 2.345 2.637 3.023a1.62 1.62 0 0 1 0 1.798c-.45.678-1.367 1.932-2.637 3.023C11.67 13.008 9.981 14 8 14c-1.981 0-3.671-.992-4.933-2.078C1.797 10.83.88 9.576.43 8.898a1.62 1.62 0 0 1 0-1.798c.45-.677 1.367-1.931 2.637-3.022C4.33 2.992 6.019 2 8 2ZM1.679 7.932a.12.12 0 0 0 0 .136c.411.622 1.241 1.75 2.366 2.717C5.176 11.758 6.527 12.5 8 12.5c1.473 0 2.825-.742 3.955-1.715 1.124-.967 1.954-2.096 2.366-2.717a.12.12 0 0 0 0-.136c-.412-.621-1.242-1.75-2.366-2.717C10.824 4.242 9.473 3.5 8 3.5c-1.473 0-2.825.742-3.955 1.715-1.124.967-1.954 2.096-2.366 2.717ZM8 10a2 2 0 1 1-.001-3.999A2 2 0 0 1 8 10Z"/></svg></button>
</header>

<div id="overlay"></div>
<aside id="sidebar">
  <div class="side-head">
    <div class="logo"><i data-lucide="bot"></i></div>
    <div class="title"><span>SAGOR</span> AI <i data-lucide="badge-check" class="badge-check"></i></div>
    <button id="sideclose" title="বন্ধ করো"><i data-lucide="x"></i></button>
  </div>
  <button class="side-item" id="sideNewchat"><i data-lucide="plus"></i> New Chat</button>
  <div class="side-foot">SAGOR AI — Premium</div>
</aside>

<div id="chat"></div>

<div id="chips">
  <button class="chip" data-text="হ্যালো!"><span class="material-icons">waving_hand</span>হ্যালো!</button>
  <button class="chip" data-text="তুমি কে?"><span class="material-icons">smart_toy</span>তুমি কে?</button>
  <button class="chip" data-text="একটা মজার গল্প বলো"><span class="material-icons">auto_stories</span>একটা মজার গল্প বলো</button>
  <button class="chip" data-text="বাংলাদেশ সম্পর্কে বলো"><span class="material-icons">public</span>বাংলাদেশ সম্পর্কে বলো</button>
</div>

<form id="form"><div id="form-inner">
  <input id="input" type="text" placeholder="মেসেজ লিখো..." autocomplete="off">
  <button id="send" type="submit"><i data-lucide="send"></i></button>
</div></form>
<footer><i data-lucide="sparkles"></i> SAGOR AI — Free icons: Lucide, Font Awesome, Material Icons</footer>

<script>
  const API = "";
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const history = JSON.parse(localStorage.getItem("sagor-chat") || "[]");

  function icons() { if (window.lucide) lucide.createIcons(); }

  function row(text, who) {
    const r = document.createElement("div");
    r.className = "row " + who;
    const av = document.createElement("div");
    av.className = "avatar " + who;
    av.innerHTML = who === "ai" ? '<i data-lucide="bot"></i>' : '<i data-lucide="user"></i>';
    const box = document.createElement("div");
    const m = document.createElement("div");
    m.className = "msg";
    m.textContent = text;
    box.appendChild(m);
    if (who === "ai") {
      const t = document.createElement("div");
      t.className = "tools";
      const c = document.createElement("button");
      c.innerHTML = '<i data-lucide="copy"></i> Copy';
      c.onclick = () => { navigator.clipboard.writeText(text); c.innerHTML = '<i data-lucide="check"></i> Copied'; icons(); };
      t.appendChild(c);
      box.appendChild(t);
    }
    r.appendChild(av);
    r.appendChild(box);
    chat.appendChild(r);
    chat.scrollTop = chat.scrollHeight;
    icons();
    return m;
  }

  history.forEach(h => row(h.text, h.who));
  if (!history.length) row("হ্যালো! আমি SAGOR AI। কী জানতে চাও?", "ai");

  function save() {
    const items = [...chat.querySelectorAll(".row")].map(r => ({
      text: r.querySelector(".msg").textContent,
      who: r.classList.contains("user") ? "user" : "ai"
    }));
    localStorage.setItem("sagor-chat", JSON.stringify(items.slice(-50)));
  }

  async function ask(text) {
    row(text, "user");
    const t = row("", "ai");
    t.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
    send.disabled = true;
    try {
      const r = await fetch(API + "/sagor?message=" + encodeURIComponent(text));
      const j = await r.json();
      t.textContent = j.reply || j.message || "দুঃখিত, উত্তর পাওয়া যায়নি।";
    } catch (e) {
      t.textContent = "সার্ভারে সমস্যা হয়েছে, আবার চেষ্টা করো।";
    }
    send.disabled = false;
    save();
  }

  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v) return;
    input.value = "";
    ask(v);
  });
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => ask(c.dataset.text)));
  function newChat() {
    localStorage.removeItem("sagor-chat");
    chat.innerHTML = "";
    row("হ্যালো! আমি SAGOR AI। কী জানতে চাও?", "ai");
  }
  document.getElementById("newchat").addEventListener("click", newChat);
  document.getElementById("sideNewchat").addEventListener("click", () => { newChat(); closeSidebar(); });
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");
  function openSidebar() { sidebar.classList.add("open"); overlay.classList.add("show"); }
  function closeSidebar() { sidebar.classList.remove("open"); overlay.classList.remove("show"); }
  document.getElementById("sidebartoggle").addEventListener("click", () => {
    sidebar.classList.contains("open") ? closeSidebar() : openSidebar();
  });
  document.getElementById("sideclose").addEventListener("click", closeSidebar);
  overlay.addEventListener("click", closeSidebar);
  const eyetoggle = document.getElementById("eyetoggle");
  const chipsBox = document.getElementById("chips");
  const eyeSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 2c1.981 0 3.671.992 4.933 2.078 1.27 1.091 2.187 2.345 2.637 3.023a1.62 1.62 0 0 1 0 1.798c-.45.678-1.367 1.932-2.637 3.023C11.67 13.008 9.981 14 8 14c-1.981 0-3.671-.992-4.933-2.078C1.797 10.83.88 9.576.43 8.898a1.62 1.62 0 0 1 0-1.798c.45-.677 1.367-1.931 2.637-3.022C4.33 2.992 6.019 2 8 2ZM1.679 7.932a.12.12 0 0 0 0 .136c.411.622 1.241 1.75 2.366 2.717C5.176 11.758 6.527 12.5 8 12.5c1.473 0 2.825-.742 3.955-1.715 1.124-.967 1.954-2.096 2.366-2.717a.12.12 0 0 0 0-.136c-.412-.621-1.242-1.75-2.366-2.717C10.824 4.242 9.473 3.5 8 3.5c-1.473 0-2.825.742-3.955 1.715-1.124.967-1.954 2.096-2.366 2.717ZM8 10a2 2 0 1 1-.001-3.999A2 2 0 0 1 8 10Z"/></svg>';
  const eyeClosedSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M.143 2.31a.75.75 0 0 1 1.047-.167l14.5 10.5a.75.75 0 1 1-.88 1.214l-2.248-1.628C11.346 13.19 9.792 14 8 14c-1.981 0-3.67-.992-4.933-2.078C1.797 10.832.88 9.577.43 8.9a1.619 1.619 0 0 1 0-1.797c.353-.533.995-1.42 1.868-2.305L.31 3.357A.75.75 0 0 1 .143 2.31Zm1.536 5.622A.12.12 0 0 0 1.657 8c0 .021.006.045.022.068.412.621 1.242 1.75 2.366 2.717C5.175 11.758 6.527 12.5 8 12.5c1.195 0 2.31-.488 3.29-1.191L9.063 9.695A2 2 0 0 1 6.058 7.52L3.529 5.688a14.207 14.207 0 0 0-1.85 2.244ZM8 3.5c-.516 0-1.017.09-1.499.251a.75.75 0 1 1-.473-1.423A6.207 6.207 0 0 1 8 2c1.981 0 3.67.992 4.933 2.078 1.27 1.091 2.187 2.345 2.637 3.023a1.62 1.62 0 0 1 0 1.798c-.11.166-.248.365-.41.587a.75.75 0 1 1-1.21-.887c.148-.201.272-.382.371-.53a.119.119 0 0 0 0-.137c-.412-.621-1.242-1.75-2.366-2.717C10.825 4.242 9.473 3.5 8 3.5Z"/></svg>';
  eyetoggle.addEventListener("click", () => {
    const hidden = chipsBox.style.display === "none";
    chipsBox.style.display = hidden ? "flex" : "none";
    eyetoggle.innerHTML = hidden ? eyeSVG : eyeClosedSVG;
    eyetoggle.title = hidden ? "Suggestions লুকাও" : "Suggestions দেখাও";
  });
  icons();
</script>
</body>
</html>
