<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAGOR AI — Premium</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: sans-serif; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column;
    background: #070b16;
    background-image: radial-gradient(600px 300px at 15% 0%, rgba(56,189,248,0.25), transparent 60%),
      radial-gradient(600px 300px at 90% 100%, rgba(168,85,247,0.25), transparent 60%);
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 16px 22px;
    background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 10;
  }
  .logo {
    width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #38bdf8, #a855f7); color: #fff; font-size: 22px;
    box-shadow: 0 0 24px rgba(56,189,248,0.5);
  }
  .logo svg { width: 26px; height: 26px; }
  .title { font-size: 22px; font-weight: bold; letter-spacing: 1px; }
  .title span { background: linear-gradient(90deg, #38bdf8, #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .subtitle { font-size: 12px; color: #94a3b8; }
  #newchat {
    margin-left: auto; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: #e2e8f0; padding: 9px 14px; border-radius: 20px; cursor: pointer; font-size: 14px; display: flex; gap: 6px; align-items: center;
  }
  #newchat svg { width: 16px; height: 16px; }
  #newchat:hover { background: rgba(255,255,255,0.12); }
  #chat { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; max-width: 820px; width: 100%; margin: 0 auto; }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row.user { flex-direction: row-reverse; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .avatar svg { width: 19px; height: 19px; }
  .avatar.ai { background: linear-gradient(135deg, #38bdf8, #a855f7); }
  .avatar.user { background: #334155; }
  .msg {
    max-width: 80%; padding: 13px 17px; border-radius: 18px; line-height: 1.65; white-space: pre-wrap; word-wrap: break-word;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }
  .row.user .msg { background: linear-gradient(135deg, #0284c7, #7c3aed); border: none; }
  .tools { display: flex; gap: 8px; margin-top: 6px; }
  .tools button {
    background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 13px; display: flex; gap: 4px; align-items: center;
  }
  .tools button:hover { color: #e2e8f0; }
  .tools svg { width: 14px; height: 14px; }
  .dots span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #94a3b8; margin-right: 4px; animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
  #chips { display: flex; gap: 9px; flex-wrap: wrap; padding: 0 16px 14px; max-width: 820px; width: 100%; margin: 0 auto; }
  .chip {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #e2e8f0;
    padding: 9px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; display: flex; gap: 6px; align-items: center;
  }
  .chip:hover { background: rgba(56,189,248,0.15); border-color: rgba(56,189,248,0.4); }
  .chip .material-icons { font-size: 17px; color: #38bdf8; }
  #form { padding: 16px; background: rgba(255,255,255,0.04); border-top: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px); }
  #form-inner { display: flex; gap: 10px; max-width: 820px; width: 100%; margin: 0 auto; }
  #input {
    flex: 1; padding: 14px 20px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(0,0,0,0.35); color: #e2e8f0; font-size: 16px; outline: none;
  }
  #input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.2); }
  #send {
    width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer; color: #fff; font-size: 18px;
    background: linear-gradient(135deg, #38bdf8, #a855f7); box-shadow: 0 0 20px rgba(168,85,247,0.5);
  }
  #send:disabled { opacity: 0.5; }
  footer { text-align: center; font-size: 12px; color: #64748b; padding: 8px 0 14px; }
</style>
</head>
<body>
<header>
  <div class="logo"><i data-lucide="bot"></i></div>
  <div>
    <div class="title"><span>SAGOR</span> AI</div>
    <div class="subtitle">Premium AI Chat</div>
  </div>
  <button id="newchat"><i data-lucide="trash-2"></i> New Chat</button>
</header>

<div id="chat"></div>

<div id="chips">
  <button class="chip" data-text="হ্যালো!"><span class="material-icons">waving_hand</span>হ্যালো!</button>
  <button class="chip" data-text="তুমি কে?"><span class="material-icons">smart_toy</span>তুমি কে?</button>
  <button class="chip" data-text="একটা মজার গল্প বলো"><span class="material-icons">auto_stories</span>একটা মজার গল্প বলো</button>
  <button class="chip" data-text="বাংলাদেশ সম্পর্কে বলো"><span class="material-icons">public</span>বাংলাদেশ সম্পর্কে বলো</button>
</div>

<form id="form"><div id="form-inner">
  <input id="input" type="text" placeholder="মেসেজ লিখো..." autocomplete="off">
  <button id="send" type="submit"><i class="fa-solid fa-paper-plane"></i></button>
</div></form>
<footer><i data-lucide="sparkles"></i> SAGOR AI — Free icons: Lucide, Font Awesome, Material Icons</footer>

<script>
  const API = "";
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const history = JSON.parse(localStorage.getItem("sagor-chat") || "[]");

  function icons() { if (window.lucide) lucide.createIcons(); }

  function row(text, who) {
    const r = document.createElement("div");
    r.className = "row " + who;
    const av = document.createElement("div");
    av.className = "avatar " + who;
    av.innerHTML = who === "ai" ? '<i data-lucide="bot"></i>' : '<i data-lucide="user"></i>';
    const box = document.createElement("div");
    const m = document.createElement("div");
    m.className = "msg";
    m.textContent = text;
    box.appendChild(m);
    if (who === "ai") {
      const t = document.createElement("div");
      t.className = "tools";
      const c = document.createElement("button");
      c.innerHTML = '<i data-lucide="copy"></i> Copy';
      c.onclick = () => { navigator.clipboard.writeText(text); c.innerHTML = '<i data-lucide="check"></i> Copied'; icons(); };
      t.appendChild(c);
      box.appendChild(t);
    }
    r.appendChild(av);
    r.appendChild(box);
    chat.appendChild(r);
    chat.scrollTop = chat.scrollHeight;
    icons();
    return m;
  }

  history.forEach(h => row(h.text, h.who));
  if (!history.length) row("হ্যালো! আমি SAGOR AI। কী জানতে চাও?", "ai");

  function save() {
    const items = [...chat.querySelectorAll(".row")].map(r => ({
      text: r.querySelector(".msg").textContent,
      who: r.classList.contains("user") ? "user" : "ai"
    }));
    localStorage.setItem("sagor-chat", JSON.stringify(items.slice(-50)));
  }

  async function ask(text) {
    row(text, "user");
    const t = row("", "ai");
    t.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
    send.disabled = true;
    try {
      const r = await fetch(API + "/sagor?message=" + encodeURIComponent(text));
      const j = await r.json();
      t.textContent = j.reply || j.message || "দুঃখিত, উত্তর পাওয়া যায়নি।";
    } catch (e) {
      t.textContent = "সার্ভারে সমস্যা হয়েছে, আবার চেষ্টা করো।";
    }
    send.disabled = false;
    save();
  }

  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v) return;
    input.value = "";
    ask(v);
  });
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => ask(c.dataset.text)));
  document.getElementById("newchat").addEventListener("click", () => {
    localStorage.removeItem("sagor-chat");
    chat.innerHTML = "";
    row("হ্যালো! আমি SAGOR AI। কী জানতে চাও?", "ai");
  });
  icons();
</script>
</body>
</html>
